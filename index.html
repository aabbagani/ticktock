<style>
:root{
  --page:#f4f6f9; --white:#fff; --line:#e3e7ed; --line-2:#d3d9e1;
  --ink:#2f3a4c; --ink-2:#5d687a; --ink-3:#97a0ae;
  --blue:#3d8fe0; --title:#4a8fe2;
  --green:#22a37a; --green-soft:#e8f6ef;
  --red:#d9534f; --amber:#d9861c;
  --bar:#1f2124;
  --font:"Lato","Helvetica Neue",Helvetica,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.strip{background:#eceff3;color:var(--ink-2);font-size:12.5px;text-align:center;padding:5px 16px}
.bar{background:var(--bar);color:#fff;position:sticky;top:0;z-index:10}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 20px}
.word{font-weight:800;font-size:22px;letter-spacing:.07em;color:#fff;text-decoration:none}
.vclogo{height:30px;width:auto;display:block}
.word{display:inline-flex;align-items:center;gap:10px}
.ttlogo{width:32px;height:32px;display:block}
@media (max-width:640px){.ttlogo{width:26px;height:26px}}
@media (max-width:640px){.vclogo{height:24px}}
.crumb{color:#9aa3ae;font-size:14px;white-space:nowrap}
.sp{flex:1}
.today{color:#cfd4db;font-size:14px;white-space:nowrap}
.today b{color:#fff}
.next{background:var(--green);color:#fff;border:0;border-radius:4px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.next:disabled{opacity:.45;cursor:not-allowed}
.reset{background:transparent;border:0;color:#9aa3ae;font-size:14px;text-decoration:underline;padding:4px}

main{max-width:820px;margin:0 auto;padding:28px 20px 24px}
h1{font-size:32px;font-weight:300;margin:0;color:var(--ink);line-height:1.2}
.lead{color:var(--ink-2);font-size:17px;margin:6px 0 4px}
.sortline{font-size:14px;color:var(--ink-3);margin:0 0 18px}
.sortline button{border:0;background:none;color:var(--blue);padding:0;font-size:14px;text-decoration:underline}

.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px 18px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--blue)}
.card.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{background:#fff4dc}100%{background:#fff}}
.num{font-size:22px;font-weight:300;color:var(--ink-3);width:26px;text-align:center;flex:none}
.num.first{color:var(--red)}
.body{flex:1;min-width:0}
.who{font-size:18px;color:var(--ink)}
.who b{font-weight:700}
.left{font-weight:700;font-size:15px;margin-top:2px}
.left.red{color:var(--red)} .left.amber{color:var(--amber)} .left.ok{color:var(--green)} .left.grey{color:var(--ink-3)} .left.plain{color:var(--ink)}
.why{color:var(--ink-2);font-size:14px;margin-top:2px}
.tag{display:inline-block;background:var(--amber);color:#fff;font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.fix{flex:none;background:#fff;border:1.5px solid var(--blue);color:var(--blue);border-radius:4px;padding:7px 16px;font-weight:700;font-size:14px}
.card:hover .fix{background:var(--blue);color:#fff}
.empty{background:#fff;border:1px dashed var(--line-2);border-radius:6px;padding:28px;text-align:center;color:var(--ink-2)}

.done{margin-top:28px}
.done summary{cursor:pointer;color:var(--ink-2);font-size:15px}
.done ul{list-style:none;padding:0;margin:10px 0 0}
.done li{padding:8px 0;border-bottom:1px dotted var(--line-2);font-size:14.5px;color:var(--ink-2)}
.done li b{color:var(--ink)}
.done li .ck{color:var(--green);font-weight:700;margin-right:6px}

footer{max-width:820px;margin:0 auto;padding:0 20px 20px;font-size:13px;color:var(--ink-3)}
footer a{color:var(--blue)}

/* panel */
.scrim{position:fixed;inset:0;background:rgba(25,32,44,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .16s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;left:50%;top:50%;width:min(560px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:#fff;border-radius:8px;z-index:50;box-shadow:0 18px 50px rgba(20,30,50,.25);transform:translate(-50%,-48%);opacity:0;pointer-events:none;transition:all .16s;padding:26px 26px 22px}
.panel.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:28px;line-height:1;color:var(--ink-3)}
.p-title{font-size:24px;font-weight:400;margin:0 30px 4px 0;line-height:1.25}
.p-sub{color:var(--ink-3);font-size:14px}
.p-left{font-size:20px;font-weight:700;margin:14px 0 18px}
.p-ask{font-weight:700;margin-bottom:8px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{background:#fff;border:1px solid var(--line-2);border-radius:5px;padding:12px;text-align:left;font-size:15px;color:var(--ink)}
.choice:hover{border-color:var(--green);background:var(--green-soft)}
details.more{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;color:var(--blue);font-size:14px}
.tl{list-style:none;padding:0;margin:10px 0 0}
.tl li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;border-bottom:1px dotted var(--line-2)}
.tl li:last-child{border-bottom:0}
.tl .bad{color:var(--red)}
.tl .when{color:var(--ink-3);white-space:nowrap}
.note{font-size:13.5px;color:var(--ink-2);margin-top:10px}
.p-done{background:var(--green-soft);border-radius:5px;padding:12px 14px;color:#176b52}

/* how it works */
.how h1{color:var(--title);font-size:28px}
.how .lead{margin:4px 0 0}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.step{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 14px}
.step b{display:block;font-size:17px;margin-bottom:2px}
.step span{color:var(--ink-2);font-size:15px}
.rules{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 16px;font-size:15px;color:var(--ink-2)}
.rules b{color:var(--ink)}
.rules ul{margin:6px 0 0;padding-left:20px}
.back{border:0;background:none;color:var(--blue);padding:0;font-size:15px;margin-bottom:12px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);background:#2b2f35;color:#fff;padding:11px 16px;border-radius:5px;font-size:14px;opacity:0;transition:all .2s;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}

.explain{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#fff;border:1px solid var(--line);border-radius:6px;margin:0 0 22px;overflow:hidden}
.explain div{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);line-height:1.35}
.explain div+div{border-left:1px solid var(--line)}
.explain .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.explain b{color:var(--ink);display:block;font-size:15px}
.howbtn{background:var(--blue);border:1px solid var(--blue);color:#fff;border-radius:4px;padding:8px 14px;font-size:14px;font-weight:700;white-space:nowrap;text-decoration:none}
.howbtn:hover{background:#2f7fd0;border-color:#2f7fd0}

.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:6px;padding:0 12px;margin:0 0 12px;height:44px}
.search svg{flex:none;color:var(--ink-3)}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;color:var(--ink);background:transparent;min-width:0}
.search input::placeholder{color:var(--ink-3)}
.match{font-size:14px;color:var(--ink-2);margin:-4px 0 12px}
.tier{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f7f9fb;border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin:-6px 0 18px}
.tier .t{font-size:14.5px;color:var(--ink)}
.tier .h{display:block;font-size:12.5px;color:var(--ink-3)}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;color:var(--ink-2);flex:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:38px;height:22px;border-radius:11px;background:#cfd6df;position:relative;transition:background .15s}
.sw .tr::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw input:checked + .tr{background:var(--red)}
.sw input:checked + .tr::after{left:19px}
.sw input:focus-visible + .tr{outline:2px solid var(--blue);outline-offset:2px}
.sw .lbl{min-width:58px;font-weight:700}
.hist{list-style:none;padding:0;margin:8px 0 0}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;border-bottom:1px dotted var(--line-2)}
.hist li:last-child{border-bottom:0}
.hist .who{color:var(--ink-3);white-space:nowrap;text-align:right;font-size:13px}
.sub-h{font-weight:700;font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 2px}
.done li{padding:0;border-bottom:1px dotted var(--line-2)}
.done li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:9px 2px;text-align:left;font-size:14.5px;color:var(--ink-2)}
.done li button:hover{color:var(--ink)}
.done li .d{color:var(--blue);font-size:13.5px;white-space:nowrap}

.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:13.5px;color:var(--ink-2);margin:0 0 4px}
.legend .k{color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.legend .r{background:var(--red)} .legend .a{background:var(--amber)} .legend .g{background:var(--green)} .legend .u{background:#c6ccd5}
.legend-note a{color:var(--blue)}
.legend-note{font-size:13px;color:var(--ink-3);margin:0 0 14px}

.tabs{background:#fff;border-bottom:1px solid var(--line)}
.tabs-in{max-width:820px;margin:0 auto;display:flex;gap:4px;padding:0 20px;overflow-x:auto}
.tabs a{padding:12px 12px;color:var(--ink-2);text-decoration:none;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;text-align:center}
.meds{background:#fff;border:1px solid var(--line);border-radius:6px}
.med{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.med:last-child{border-bottom:0}
.med .nm{font-size:16px;color:var(--ink)}
.med .on-list{display:block;font-size:13px;color:var(--ink-3)}
.showall{border:0;background:none;color:var(--blue);padding:0;font-size:14px;text-decoration:underline;margin-top:12px}

.howto{background:#fff;border:1px solid #cfe2f6;border-left:4px solid var(--blue);border-radius:4px;padding:12px 14px;color:var(--ink-2);font-size:15px;margin:10px 0 16px}
.howto b{color:var(--ink)} .howto a{color:var(--blue)}
.medbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;font-size:14px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:700}
.tiny{font-size:13px;color:var(--ink-3)}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.medtable{width:100%;border-collapse:collapse}
.medtable th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px;background:#fafbfc;border-bottom:1px solid var(--line)}
.medtable td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14.5px}
.medtable tr:last-child td{border-bottom:0}
.medtable .nm{display:block;color:var(--ink);font-size:15.5px}
.medtable .gen{display:block;color:var(--ink-3);font-size:12.5px}
.medtable .c-use{color:var(--ink-2)}
.medtable .c-sw{width:150px}
.olink{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:4px;padding:3px 9px;font-size:13.5px;font-weight:700;margin:2px 4px 2px 0}
.olink:hover{background:var(--blue);color:#fff}
.none{color:var(--ink-3)}

.rlist{list-style:none;margin:10px 0 0;padding:0}
.rlist li{display:flex;gap:12px;align-items:flex-start;padding:5px 0;border-bottom:1px dotted var(--line-2)}
.rlist li:last-child{border-bottom:0}
.rid{flex:none;min-width:34px;text-align:center;background:var(--page);border:1px solid var(--line-2);border-radius:4px;font-size:12.5px;font-weight:700;color:var(--ink-2);padding:2px 0}
.rlist b{color:var(--ink)}

.medtable .nm2{display:block;color:var(--ink);font-size:15px}
.olink.stuck{border-color:var(--red);color:var(--red)}
.olink.stuck:hover{background:var(--red);color:#fff}
.st-ok{color:var(--green);font-weight:700;display:block}
.st-done{color:var(--ink-2);font-weight:700;display:block}
.stuckrow td{background:#fffafa}

.st-on{color:var(--green);font-weight:700;display:block}
.st-muted{color:var(--ink-2);font-weight:700;display:block}
.seeall{color:var(--blue);font-size:15px;text-decoration:none;white-space:nowrap}
.headrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ordtable td.c-st{width:230px}

.waitcount{font-size:15px;color:var(--amber);font-weight:700}
.done.waiting summary{color:var(--amber);font-weight:700}
.hg{margin-right:6px}
.rec{border:1.5px solid var(--line-2);border-radius:8px;padding:14px;margin:4px 0 10px}
.rec.is-rec{border-color:var(--green);background:#f6fcf9}
.rec-h{font-size:17px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{background:var(--green);color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:2px 7px}
.rec-why{color:var(--ink-2);font-size:14.5px;margin:4px 0 10px}
.flabel{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:6px 0 6px}
.msg{display:block;width:100%;min-height:84px;margin-top:0;font:inherit;font-size:14.5px;line-height:1.45;color:var(--ink);border:1px solid var(--line-2);border-radius:5px;padding:9px 10px;resize:vertical;background:#fff}
.others .link{border:0;background:none;padding:0;color:var(--blue);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
.others .link:hover{color:var(--ink)}
.go{display:block;width:100%;margin-top:10px;background:var(--green);color:#fff;border:0;border-radius:5px;padding:11px;font-weight:700;font-size:15px}
.go:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:#fff;border:1px solid var(--line-2);border-radius:5px;padding:11px;font-size:15px;color:var(--ink);margin-top:10px}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row-btns .go{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:#fff;border:1px solid var(--line-2);border-radius:16px;padding:6px 12px;font-size:14px;color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.chips input[type=date]{border:1px solid var(--line-2);border-radius:16px;padding:5px 10px;font:inherit;font-size:14px;color:var(--ink)}
.hint-i{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14.5px;color:var(--ink);cursor:pointer}
.check input{width:17px;height:17px}
.declined{background:#f3f5f8;border-left:3px solid var(--ink-3);border-radius:4px;padding:8px 12px;font-size:14px;color:var(--ink-2);margin:-6px 0 12px}
.warn-line{margin-top:8px;font-size:13.5px;color:#9a5b00;background:#fff4e0;border-radius:4px;padding:7px 10px}
.sel{width:100%;border:1px solid var(--line-2);border-radius:5px;padding:9px 10px;font:inherit;font-size:15px;background:#fff}
.others{font-size:14px;color:var(--ink-2);margin-bottom:14px;line-height:1.8}
.others .link{font-size:14px}
.p-wait{background:#fff7ea;border-left:3px solid var(--amber);border-radius:4px;padding:10px 12px;margin-top:14px;font-size:15px;color:var(--ink)}

.me{color:#c9ced6;font-size:14px;white-space:nowrap}
.me b{color:#fff}
.assignee{display:block;font-size:13px;color:var(--ink-3);margin-top:2px}
.assignee.mine{color:var(--blue);font-weight:700}
.assignee.other{color:var(--ink-2);font-weight:700}
.assign{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-size:14px;color:var(--ink-2)}
.assign select{border:1px solid var(--line-2);border-radius:5px;padding:6px 8px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.lockmsg{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#eef4fc;border-left:3px solid var(--blue);border-radius:4px;padding:10px 12px;margin:10px 0 12px;font-size:14.5px;color:var(--ink)}
.lockmsg button{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:7px 12px;font-weight:700;font-size:14px}
.locked{opacity:.45;pointer-events:none;filter:grayscale(.3)}
.stockline{font-size:13px;color:var(--ink-2);background:#f3f6fa;border-radius:4px;padding:7px 10px;margin:0 0 8px}

.rhead{display:flex;flex-direction:column;gap:4px;margin-bottom:4px}
.override{font-size:14px;color:var(--ink-2);background:#fdecea;border-left:3px solid var(--red);border-radius:4px;padding:6px 10px}
.rlist .rtxt{flex:1;min-width:0}
.rfix{flex:none;width:250px;text-align:right;font-size:13.5px;font-weight:700;color:var(--green)}
.rfix::before{content:"→ ";color:var(--ink-3);font-weight:400}
.rfoot{font-size:13.5px;color:var(--ink-3);margin-top:6px}
.rfoot b{color:var(--ink-2)}

@media (max-width:640px){
  .bar-in{flex-wrap:wrap;gap:8px 12px;padding:10px 16px}
  .crumb{display:none}
  .rlist li{flex-wrap:wrap}
  .rfix{max-width:none;width:100%;text-align:left;padding-left:46px}
  .me{order:4;width:100%;font-size:13px}
  .medtable .c-use{display:none}
  .medtable thead{display:none}
  .medtable tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .medtable tr:last-child{border-bottom:0}
  .medtable td{border:0 !important;padding:0 !important;grid-column:1}
  .medtable td.c-sw{grid-column:2;grid-row:1 / span 3;align-self:center}
  .ordtable td.c-st{width:auto}
  .medtable td:nth-child(2) .gen{display:none}
  .medtable td:nth-child(2) .nm2{font-size:14.5px;color:var(--ink-2)}
  .medtable td .olink{margin:2px 0}
  .medtable tr.stuckrow{background:#fffafa}
  .medtable tr.stuckrow td{background:transparent}
  .medtable .gen{font-size:12px}
  .medtable td,.medtable th{padding:9px 10px}
  .medtable .c-sw{width:auto}
  .medtable .sw .lbl{display:none}
  .seg button{padding:7px 9px;font-size:13px}
  .tabs-in{padding:0 8px}
  .tabs a{padding:11px 9px;font-size:14px}
  .today{order:3}
  main{padding:22px 16px 30px}
  h1{font-size:26px}
  .lead{font-size:16px}
  .card{padding:14px;gap:12px}
  .who{font-size:17px}
  .fix{padding:6px 12px}
  .choices,.steps{grid-template-columns:1fr}
  .row-btns{grid-template-columns:1fr}
  .explain{grid-template-columns:1fr}
  .explain div+div{border-left:0;border-top:1px solid var(--line)}
  .explain div{padding:9px 12px}
  .panel{width:100%;height:100%;max-height:100%;border-radius:0;top:0;left:0;transform:translateY(12px)}
  .panel.on{transform:none}
}
</style>
</head>

/* ---------- state ---------- */
let S;
function freshState(){
  return {
    now: START,
    tiers: Object.fromEntries(Object.entries(DRUGS).map(([k,v]) => [k, v.tier])),
    exceptions: {},          // orderId -> exception
    sort: 'urgency',
    filter: 'active',
    seq: 0,
    advances: 0,
    newIds: [],   // raised by the most recent clock advance (keeps the New chip)
    flash: []     // animate once
  };
}

/* ---------- rule engine ---------- */
function evalOrder(o, now){
  const ev = o.events.filter(e => e[1] <= now);
  const last = t => { const m = ev.filter(e => e[0]===t); return m.length ? m[m.length-1] : null; };
  const p = PATHS[o.path];
  const approved = last('approved')[1];
  const ack = last('ack'), shipped = last('shipped'), delivered = last('delivered');
  const bo = last('backorder');
  const scans = ev.filter(e => e[0]==='scan' || e[0]==='shipped');
  const lastMove = scans.length ? scans[scans.length-1][1] : null;
  const ackBy = p.ackDays ? addBiz(approved, p.ackDays) : null;
  const shipBy = addBiz(approved, p.shipDays);
  const out = { approved, ackBy, shipBy, ack: ack&&ack[1], shipped: shipped&&shipped[1], delivered: delivered&&delivered[1], lastMove, rule:null, deadline:null, late:0 };

  if (delivered){ out.status = 'Delivered'; return out; }
  if (bo){ out.rule='R4'; out.deadline=bo[1]; out.late=diff(now,bo[1]); out.detail=bo[2]||'Vendor reported a backorder'; out.status='Backordered'; return out; }
  if (o.path==='autoship'){
    if (!shipped){
      if (now > shipBy){ out.rule='R5'; out.deadline=shipBy; out.late=diff(now,shipBy); out.status='Autoship missed'; }
      else out.status='Scheduled';
      return out;
    }
  } else {
    if (!ack){
      if (now > ackBy){ out.rule='R1'; out.deadline=ackBy; out.late=diff(now,ackBy); out.status='Awaiting vendor'; }
      else out.status='Awaiting vendor';
      return out;
    }
    if (!shipped){
      if (now > shipBy){ out.rule='R2'; out.deadline=shipBy; out.late=diff(now,shipBy); out.status='Not shipped'; }
      else out.status='Awaiting shipment';
      return out;
    }
  }
  const gapDeadline = addDays(lastMove, p.scanGap);
  if (now > gapDeadline){ out.rule='R3'; out.deadline=gapDeadline; out.late=diff(now,gapDeadline); out.status='Stuck in transit'; }
  else out.status='In transit';
  return out;
}

function supplyOf(o, now){
  if (o.dose == null) return { known:false };
  const days = Math.floor(o.qty / o.dose);
  const runOut = addDays(o.lastFill, days);
  return { known:true, days, runOut, left: diff(runOut, now) };
}

function audit(x, text, actor){
  x.audit.push({ date:S.now, time:new Date().toTimeString().slice(0,5), text, actor: actor||ME });
}

function runRules(){
  const created = [];
  for (const o of SEED){
    const r = evalOrder(o, S.now);
    let x = S.exceptions[o.id];
    if (r.rule && !x){
      x = S.exceptions[o.id] = { id:'EX-' + String(++S.seq).padStart(3,'0'), orderId:o.id, rule:r.rule, raised:S.now, firstBreach:addDays(r.deadline, r.rule==='R4'?0:1), state:'open', owner:'', resolution:'', note:'', audit:[] };
      audit(x, `Raised by rule ${r.rule} · ${RULES[r.rule].name}`, 'TickTock (system)');
      created.push(o.id);
    }
    if (x && x.state !== 'resolved' && r.delivered){
      x.state = 'resolved';
      x.resolution = 'Delivered (auto-closed)';
      x.note = `Carrier confirmed delivery on ${fmt(r.delivered)}.`;
      audit(x, `Auto-resolved: order delivered ${fmt(r.delivered)}`, 'TickTock (system)');
    }
  }
  return created;
}

/* ---------- ranking (D1) ---------- */
function enrich(x){
  const o = SEED.find(s => s.id===x.orderId);
  const r = evalOrder(o, S.now);
  const sup = supplyOf(o, S.now);
  const tier = S.tiers[o.drug];
  const lateNow = r.rule ? r.late : 0;
  let group;
  if (tier==='critical' && sup.known && sup.left <= 7) group = 0;
  else if (!sup.known) group = 1;
  else group = 2;
  return { x, o, r, sup, tier, lateNow, group };
}
function ranked(list, mode){
  const a = list.slice();
  if (mode==='late'){
    a.sort((p,q) => (q.lateNow - p.lateNow) || supKey(p) - supKey(q) || p.o.id.localeCompare(q.o.id));
  } else {
    a.sort((p,q) => (p.group - q.group)
      || (p.group===1 ? (q.lateNow - p.lateNow) : (supKey(p) - supKey(q)) || (q.lateNow - p.lateNow))
      || p.o.id.localeCompare(q.o.id));
  }
  return a;
}
const supKey = e => e.sup.known ? e.sup.left : 9999;

function rankWhy(e, mode){
  if (mode==='late') return `Sorted by <b>days late</b> only. Switch to <b>Urgency</b> to rank by when the pet runs out.`;
  if (e.group===0) return `<b>Critical-tier drug with ${supplyText(e.sup)}.</b> Critical drugs with ≤ 7 days of supply rank first, soonest run-out first.`;
  if (e.group===1) return `<b>Supply unknown</b>, because the directions (“${esc(e.o.sig)}”) can’t be turned into a daily dose. Ranked by days late, right after the critical items. TickTock never guesses a run-out date.`;
  return `<b>${e.tier==='critical' ? 'Critical tier, but more than 7 days of supply' : 'Maintenance tier'}.</b> Ranked by soonest run-out after the critical and supply-unknown items.`;
}
function supplyText(sup){
  if (!sup.known) return 'supply unknown';
  if (sup.left < 0) return `out of supply ${plural(-sup.left,'day')} ago`;
  if (sup.left === 0) return 'runs out today';
  return `${plural(sup.left,'day')} of supply`;
}
function supplyClass(e){
  if (!e.sup.known) return 'unknown';
  if (e.sup.left <= 3) return 'crit';
  if (e.sup.left <= 7) return 'warn';
  return '';
}
function lateText(e){
  const r = e.r;
  if (!r.rule){
    if (r.delivered) return `Delivered ${fmt(r.delivered)}`;
    return r.status;
  }
  if (r.rule==='R4') return r.late===0 ? 'Reported today' : `Reported ${plural(r.late,'day')} ago`;
  if (r.rule==='R3') return `${plural(r.late,'day')} past scan window`;
  if (r.rule==='R1') return `${plural(r.late,'day')} past ack-by (${fmt(r.deadline)})`;
  if (r.rule==='R5') return `${plural(r.late,'day')} past autoship date`;
  return `${plural(r.late,'day')} past ship-by (${fmt(r.deadline)})`;
}

function leftText(e){

}

    waitdate:{ label:'Wait for a new date', why:'Use the date the pharmacy gave you, or TickTock’s estimate. TickTock checks again on that date so it isn’t forgotten.' },
    reship:  { label:'Ask the pharmacy to reship', why:`Tracking hasn’t updated since ${e.r.lastMove ? fmt(e.r.lastMove) : 'it shipped'}. A reship is usually faster than waiting.` },
    alt:     { label:'Switch to an in-stock alternative', why:'The pharmacy can’t fill this right now. A vet has to approve any switch.' },
    sendnow: { label:'Send this delivery now', why:'The autoship date passed without shipping. Sending it now restarts the cycle.' },
    arrived: { label:'It arrived', why:'Close this order because the medication reached the owner.' },
    notneeded:{ label:'No longer needed', why:'Close this order because the pet doesn’t need it anymore (treatment changed, owner switched pharmacy, or similar).' }

  };
}
function estimateArrival(e){
  const days = e.x.rule==='R4' ? 5 : e.r.shipped ? 2 : 3;
  return addBiz(S.now, days);
}
function dateChips(opts, e, est){
  const sup = e.sup;
  const late = S.pick && sup.known && S.pick > sup.runOut;
  return `<div class="chips">${opts.map(d => `<button class="chip${S.pick===d?' on':''}" data-pick="${d}">${esc(dayLabel(d))}${d===est?' · estimate':''}</button>`).join('')}
      <input type="date" id="pickDate" value="${S.pick && !opts.includes(S.pick) ? S.pick : ''}" min="${addDays(S.now,1)}" aria-label="Pick another date"></div>
    ${late ? `<div class="warn-line">Heads up: ${esc(e.o.pet)} runs out ${fmt(sup.runOut)}, before this date. Consider offering pickup instead.</div>` : ''}`;
}
function actionForm(k, e){
  const o = e.o, n = NAME[o.drug];
  if (k==='pickup') return `<div class="stockline">First check that the clinic has ${esc(n)} in stock to hand over.</div>
    <label class="flabel">Text to ${esc(o.client)}</label>
    <textarea id="msg" class="note msg">${esc(`Hi ${o.client}, ${o.pet}’s ${n} delivery is delayed. We’ve set some aside for you to pick up at the clinic today. — ${CLINIC}`)}</textarea>
    <button class="go" data-do="pickup">Send text</button>`;
  if (k==='alt') return `<label class="flabel">Send to</label><select id="vet" class="sel"><option>Dr. A. Patel</option><option>Dr. M. Cho</option></select>
    <button class="go" data-do="alt">Send for approval</button>`;
  if (k==='waitdate') { const est = estimateArrival(e); if (!S.pick) S.pick = est;
    const opts = [...new Set([addBiz(S.now,1), addBiz(S.now,2), est, addBiz(est,1)])].sort();
    return `<label class="flabel">When should it arrive? <span class="hint-i">TickTock’s estimate is selected. Pick the pharmacy’s date if you have one.</span></label>
    ${dateChips(opts, e, est)}
    <label class="check"><input type="checkbox" id="told" ${S.told?'checked':''}> I’ve told the owner</label>
    <button class="go" data-do="waitdate" ${S.pick ? '' : 'disabled'}>Save date</button>`; }
  const btn = { nudge:'Send reminder', reship:'Request reship', sendnow:'Send now', arrived:'Mark as arrived', notneeded:'Close order' }[k];
  return `<button class="go" data-do="${k}">${btn}</button>`;
}
function renderPanel(){
  const x = S.exceptions[openId]; if (!x) return closePanel();
  const e = enrich(x), { o, r } = e;
  const lt = leftText(e);
  const done = x.state==='resolved', waiting = x.state==='waiting';
  const evs = o.events.filter(v => v[1] <= S.now);
  const tl = [[o.path==='autoship' ? 'Autoship scheduled' : 'Approved by clinic', fmt(r.approved), '']];
  if (o.path!=='autoship') tl.push(r.ack ? ['Pharmacy confirmed', fmt(r.ack), ''] : [`Pharmacy confirmation (due ${fmt(r.ackBy)})`, 'missing', S.now > r.ackBy ? 'bad' : '']);
  tl.push(r.shipped ? ['Shipped', fmt(r.shipped), ''] : [`Shipped (due ${fmt(r.shipBy)})`, 'not yet', S.now > r.shipBy ? 'bad' : '']);
  evs.filter(v => v[0]==='scan').forEach(v => tl.push([`Tracking: ${v[2]||'scan'}`, fmt(v[1]), '']));
  evs.filter(v => v[0]==='backorder').forEach(v => tl.push(['Pharmacy: backordered', fmt(v[1]), 'bad']));
  evs.filter(v => v[0]==='client_contact').forEach(v => tl.push([v[2], fmt(v[1]), '']));
  tl.push(r.delivered ? ['Delivered', fmt(r.delivered), ''] : ['Delivered', 'not yet', '']);
  const sup = e.sup;
  const defs = actionDefs(e), rec = recommend(e);
  const lockedByOther = !done && x.owner && !x.owner.startsWith(ME);
  const sel = S.act[x.id] || rec;
  const ruleAct = { R1:'nudge', R2:'waitdate', R3:'reship', R4:'alt', R5:'sendnow' }[x.rule];
  const others = [...new Set(['pickup', ruleAct, 'waitdate', 'arrived', 'notneeded'])].filter(k => k!==rec);
  let body;
  if (done) body = `<div class="p-done" style="margin-top:16px">✓ Done: ${esc(doneLabel(x))}${x.owner ? ` · by ${esc(x.owner.split(' · ')[0])}` : ''}</div>`;
  else if (waiting) body = `<div class="p-wait">⏳ Waiting for <b>${esc(x.waitFor)}</b>, ${esc(dayLabel(x.waitUntil))}. TickTock checks again then.</div>
    <div class="p-left left ${lt.c}" style="margin-top:12px">${esc(lt.t)}</div>
    ${x.waitKind==='pickup'
      ? `<div class="row-btns"><button class="go" data-do="pickedup">Picked up ✓</button><button class="ghost" data-do="declined">Owner said no</button></div>`
      : `<div class="row-btns"><button class="go" data-do="arrived">It arrived</button><button class="ghost" data-do="restuck">Still stuck, move back</button></div>`}`;
  else body = `<div class="p-left left ${lt.c}">${esc(lt.t)}</div>
    ${x.declinedPickup ? `<div class="declined">Owner said no to pickup (${fmt(x.declinedPickup)}). Here’s the next best option.</div>` : ''}
    <div class="rec ${sel===rec?'is-rec':''}">
      <div class="rec-h">${sel===rec ? '<span class="badge">Suggested</span>' : ''}${esc(defs[sel].label)}</div>
      ${defs[sel].why ? `<div class="rec-why">${esc(defs[sel].why)}</div>` : ''}
      ${actionForm(sel, e)}
    </div>
    <div class="others"><span class="tiny">Other options:</span> ${[rec, ...others].filter(k => k!==sel).map(k => `<button class="link" data-act="${k}">${esc(defs[k].label)}${k===rec?' (suggested)':''}</button>`).join(' · ')}</div>
    <div class="tier"><span class="t">Treat ${esc(NAME[o.drug])} as critical<span class="h">Critical medications go to the top when a pet has a week or less left.</span></span>
      <label class="sw"><input type="checkbox" id="tierSw" ${e.tier==='critical'?'checked':''}><span class="tr"></span><span class="lbl">${e.tier==='critical'?'Critical':'Standard'}</span></label></div>`;
  $('#panel').innerHTML = `
    <button class="x" id="px" aria-label="Close">×</button>
    <h2 class="p-title" id="pTitle">${esc(o.pet)}’s ${esc(NAME[o.drug])} ${HEAD[x.rule]}</h2>
    <div class="p-sub">${esc(o.species)} · owner ${esc(o.client)} · order ${o.id}</div>
    ${done ? '' : `<div class="assign"><span>Assigned to</span><select id="assignSel">
      <option value="">Unassigned</option>${OWNERS.map(w => `<option value="${esc(w)}" ${x.owner===w?'selected':''}>${esc(w.split(' · ')[0])}${w.startsWith(ME)?' (you)':''}</option>`).join('')}</select></div>`}
    ${lockedByOther ? `<div class="lockmsg"><span><b>${esc(x.owner.split(' · ')[0])}</b> is working on this. Take over so you don’t both contact the owner.</span><button id="takeOver">Take over</button></div>` : ''}
    <div class="${lockedByOther ? 'locked' : ''}">${body}</div>
    <details class="more" ${done || waiting ? 'open' : ''}><summary>${done || waiting ? 'Details' : 'Show details'}</summary>
      <div class="sub-h">Order timeline</div>
      <ul class="tl" style="margin-top:4px">${tl.map(([t,w,c]) => `<li><span class="${c}">${esc(t)}</span><span class="when ${c}">${esc(w)}</span></li>`).join('')}</ul>
      <div class="note">${sup.known ? `Last refill ${fmt(o.lastFill)}. Directions: “${esc(o.sig)}.” Runs out ${fmt(sup.runOut)}.` : `Directions say “${esc(o.sig)},” so TickTock can’t tell when it runs out. It won’t guess.`}</div>
      ${histHTML(x)}
    </details>`;
  $('#px').onclick = closePanel;
  const as = $('#assignSel');
  if (as) as.onchange = () => {
    const prev = x.owner; x.owner = as.value;
    audit(x, x.owner ? `Assigned to ${x.owner.split(' · ')[0]}${prev ? ` (was ${prev.split(' · ')[0]})` : ''}` : `Unassigned${prev ? ` (was ${prev.split(' · ')[0]})` : ''}`);
    render(); toast(x.owner ? `Assigned to ${x.owner.split(' · ')[0]}` : 'Unassigned');
  };
  const tk = $('#takeOver');
  if (tk) tk.onclick = () => { const prev = x.owner; x.owner = OWNERS[0]; audit(x, `${ME} took over from ${prev.split(' · ')[0]}`); render(); toast(`You took over ${o.pet}’s order`); };
  const ts = $('#tierSw');
  if (ts) ts.onchange = () => { setTier(o.drug, ts.checked); render(); toast(`${CAP(NAME[o.drug])} is now ${ts.checked ? 'critical' : 'standard'}. List re-sorted.`); };
  $('#panel').querySelectorAll('[data-act]').forEach(b => b.onclick = () => { S.act[x.id] = b.dataset.act; S.pick = null; renderPanel(); });
  const told = $('#told'); if (told) told.onchange = () => { S.told = told.checked; };
  $('#panel').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { S.pick = b.dataset.pick; renderPanel(); });
  const pd = $('#pickDate'); if (pd) pd.onchange = () => { S.pick = pd.value || null; renderPanel(); };
  const finish = (state, label, extra) => {
    x.owner = x.owner || OWNERS[0];
    if (state==='resolved'){ x.state='resolved'; x.resolution=label; audit(x, extra || `Done: ${label}`); }
    else { x.state='waiting'; x.waitFor=label.waitFor; x.waitUntil=label.until; audit(x, extra); }
    delete S.act[x.id]; S.pick = null;
  };
  $('#panel').querySelectorAll('[data-do]').forEach(b => b.onclick = () => {
    const k = b.dataset.do; let msg;
    if (k==='pickup'){ finish('waiting',{waitFor:'owner to pick up', until:S.now}, `Texted ${o.client}: pickup offered`); x.waitKind='pickup'; msg = `Text sent to ${o.client} (demo). Waiting for them to pick up.`; }
    else if (k==='pickedup'){ x.state='resolved'; x.resolution='Picked up at the clinic'; delete x.waitKind; audit(x,'Owner picked up at the clinic'); msg = `Done: ${o.pet}`; }
    else if (k==='declined'){ x.state='open'; x.declinedPickup=S.now; delete x.waitFor; delete x.waitUntil; delete x.waitKind; audit(x,'Owner said no to pickup'); msg = `${o.pet} is back on the list with another suggestion.`; }
    else if (k==='nudge'){ const u = addBiz(S.now,1); finish('waiting',{waitFor:'pharmacy to confirm', until:u}, 'Sent the pharmacy a reminder'); msg = `Reminder sent. Waiting until ${dayLabel(u)}.`; }
    else if (k==='reship'){ const u = addBiz(S.now,2); finish('waiting',{waitFor:'reshipped package', until:u}, 'Asked the pharmacy to reship'); msg = `Reship requested. Waiting until ${dayLabel(u)}.`; }
    else if (k==='alt'){ const v = $('#vet').value, u = addBiz(S.now,1); finish('waiting',{waitFor:`${v} to approve a switch`, until:u}, `Sent to ${v} to approve an in-stock alternative`); msg = `Sent to ${v}.`; }
    else if (k==='sendnow'){ const u = addBiz(S.now,1); finish('waiting',{waitFor:'ship scan', until:u}, 'Asked the pharmacy to send this delivery now'); msg = `Requested. Waiting until ${dayLabel(u)}.`; }
    else if (k==='notneeded'){ finish('resolved','No longer needed'); msg = `Closed: ${o.pet}`; }
    else if (k==='arrived'){ finish('resolved','It arrived'); msg = `Done: ${o.pet}`; }
    else if (k==='waitdate'){ if (!S.pick) return; const u = S.pick, t = !!S.told;
      finish('waiting',{waitFor: t ? 'new date · owner told' : 'new date · owner not told yet', until:u}, `Waiting until ${fmt(u)}${t ? ' · owner told' : ''}`);
      msg = `Saved. TickTock checks again ${dayLabel(u)}.`; }
    else if (k==='restuck'){ x.state='open'; audit(x,'Moved back to stuck'); delete x.waitFor; delete x.waitUntil; msg = `${o.pet} is back on the stuck list.`; }
    closePanel(); render(); toast(msg);
  });
}

/* ---------- wiring ---------- */
let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2600); }
function route(){ view = /^#\/how/.test(location.hash) ? 'how' : 'list'; closePanel(); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', route);
$('#scrim').onclick = closePanel;
document.addEventListener('keydown', ev => { if (ev.key==='Escape' && openId) closePanel(); });
function shiftToThisWeek(){
  const t = new Date(); const today = iso(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()));
  const weeks = Math.floor(diff(today, START) / 7);
  if (weeks <= 0) return START;
  const n = weeks * 7;
  SEED.forEach(o => { o.lastFill = addDays(o.lastFill, n); o.events.forEach(ev => { ev[1] = addDays(ev[1], n); }); });
  return addDays(START, n);
}
const NOW = shiftToThisWeek();
function init(){
  S = freshState(); S.now = NOW; S.act = {}; S.pick = null; runRules();
  const otis = S.exceptions['HD-24088']; if (otis){ otis.owner = OWNERS[2]; audit(otis, 'Assigned to Sam K.', 'Sam K.'); }
  route();
}
init();
})();
</script>
